<h2>Liste des taches</h2>​

@if (tasks$ | async; as tasks) {
    <ul>
        @for (t of tasks; track t.id) {
            <li>
                @if (t.completed) {
                    <p><s>{{ t.title }}</s></p>
                } @else {
                    <p>{{ t.title }}</p>
                }
                <button (click)="highlight(t.id)">Mettre en avant</button>
                <button (click)="removeTask(t.id)">Supprimer</button>
                <button (click)="endTask(t.id)">Terminer</button>
            </li>
        }
    </ul>
} @else {
    <p>Chargement des tâches...</p>
}


<button (click)="displayField()" >Ajouter une tâche</button>
@if (this.field == true) {
<app-task-form></app-task-form>
}

<div #highlightContainer></div>

<app-counter></app-counter>
